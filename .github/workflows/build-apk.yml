name: Build Magnet Madness - Physics Comparison

on:
  push:
    branches: [classic, arcade]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAME_VARIANT: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply common fixes and selected physics
        run: |
          test "$GAME_VARIANT" = classic || test "$GAME_VARIANT" = arcade
          python3 tools/apply_variant.py "$GAME_VARIANT"
          python3 tools/patch_v314.py "$GAME_VARIANT"
          node --check web/game.js
          test -s web/game.js

      - name: Build separately installable Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetMadness-${{ github.ref_name }}-v3.14
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VARIANT="$GAME_VARIANT"
          NAME="MagnetMadness-${VARIANT^}-v3.14.apk"
          TAG="physics-${VARIANT}-v3.14"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" --clobber
          else
            gh release create "$TAG" "$NAME" \
              --target "$GITHUB_SHA" \
              --title "Magnet Madness 3.13 - ${VARIANT^} Physics" \
              --notes "Separate side-by-side Android debug build. High-DPI adaptive Canvas, maximum 120 FPS, flat modal controls. The Classic variant retains original physics; Arcade uses gentler physics. Revive uses a 3-second test-ad overlay only (no network)." \
              --prerelease
          fi
