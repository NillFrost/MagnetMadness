name: Build Magnet Madness APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetMadness-v3.12.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MagnetMadness-v3.12.1-debug.apk
          TAG=v3.12.1-android-debug
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MagnetMadness-v3.12.1-debug.apk --clobber
          else
            gh release create "$TAG" MagnetMadness-v3.12.1-debug.apk \
              --target "$GITHUB_SHA" \
              --title 'Magnet Madness v3.12.1 — Android test APK' \
              --notes 'Offline HTML5 game in Android WebView. Debug-signed test build. Rewarded ads require SDK integration.' \
              --prerelease
          fi
