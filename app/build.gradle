plugins {
    id 'com.android.application'
}

def physicsVariant = (System.getenv('GAME_VARIANT') ?: 'classic').toLowerCase()
if (!(physicsVariant in ['classic', 'arcade'])) throw new GradleException('Invalid GAME_VARIANT')

android {
    namespace 'com.nillfrost.magnetmadness'
    compileSdk 36

    defaultConfig {
        applicationId "com.nillfrost.magnetmadness.${physicsVariant}"
        minSdk 24
        targetSdk 36
        versionCode 31301
        versionName "3.13-${physicsVariant}"
        manifestPlaceholders = [appLabel: "Magnet Madness ${physicsVariant.capitalize()}"]
    }

    sourceSets {
        main {
            assets.srcDirs += ["${rootProject.projectDir}/web"]
        }
    }

    buildTypes {
        debug {
            // Android signs this variant automatically using a debug keystore.
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Release signing is intentionally not hardcoded.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
